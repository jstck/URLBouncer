name: Swift

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: make build

      # Fast, deterministic unit tests only - the integration suite drives
      # real installed browsers and isn't something a CI runner can do.
      - name: Run fast unit tests
        run: make test-fast
