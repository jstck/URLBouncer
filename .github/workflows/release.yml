name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run fast unit tests
        run: make test-fast

      - name: Build app bundle
        run: make bundle

      - name: Package as DMG
        run: hdiutil create -volname "URLBouncer" -srcfolder URLBouncer.app -ov -format UDZO URLBouncer.dmg

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" URLBouncer.dmg \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --notes "**Unsigned build.** This isn't signed with an Apple Developer ID, so macOS will block it on first launch. To open it: try launching it once (it'll be blocked), then go to System Settings > Privacy & Security, find the block notice for URLBouncer near the bottom of the page, and click \"Open Anyway.\" Launch it again to confirm. See the README's Troubleshooting section for more."
