# URLBouncer Configuration
# Installed to: ~/.config/urlbouncer/config.yaml
#
# Rules are evaluated top-to-bottom; the first match wins.
#
# 'match' options:
#   - Plain string   → case-insensitive substring match against the hostname
#   - Contains / or ? → matched against the full URL
#   - Prefix 're:'   → regex matched against the full URL (case-insensitive)
#
# 'profile' is the Chrome profile directory name.
# Run URLBouncer → menu bar → "Chrome Profiles" to see your available profiles.
# Common values: "Default", "Profile 1", "Profile 2", etc.

rules:
  - match: "github.com"
    profile: "Profile 1"   # work
  - match: "youtube.com"
    profile: "Profile 2"     # personal

default_profile: "Profile 2"
